[project]
name = "2d-bone-anim-agent"
version = "0.1.0"
description = "LLM agent that generates 2D humanoid bone rigs for Unity from a short text prompt"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "langgraph>=1.2.11",
    "logfire>=5.1.0",
    "numpy>=2.4.6",
    "pydantic-ai-slim[anthropic,mcp,openai]>=2.46.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
rig-agent = "rig_agent.cli:main"

[project.optional-dependencies]
eval = [
    "pillow>=12.3.0",
    "pydantic-evals>=2.46.0",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rig_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["unity-project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["unity-project", "out", ".venv"]
pythonpath = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live and not unity'"
markers = [
    "live: calls the real OpenAI API (needs OPENAI_API_KEY); run with: pytest -m live",
    "unity: needs a running Unity Editor with the MCP for Unity server; run with: pytest -m unity",
]
filterwarnings = ["ignore:There is no current event loop:DeprecationWarning"]

[tool.mypy]
plugins = ["pydantic.mypy"]
